    <title>Follow Me Physiotherapy — More good years with the people you love</title>
    <script>
      // Set theme before paint to prevent flash. Default to v1.
      (function () {
        try {
          var t = localStorage.getItem("fmp-theme");
          document.documentElement.dataset.theme = t === "v2" ? "v2" : "v1";
        } catch (e) {
          document.documentElement.dataset.theme = "v1";
        }
      })();
    </script>

    <div id="root"></div>

  </body>
